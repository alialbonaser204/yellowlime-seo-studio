openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: partners
    description: Partner operations
  - name: briefings
    description: Briefing operations
  - name: yellowlimers
    description: Yellowlimer employee operations
  - name: articles
    description: Article and human review operations
  - name: semrush
    description: Semrush SEO research operations
  - name: google
    description: Google account connection for Search Console data
  - name: Storage
    description: Object storage upload and serving endpoints
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /partners:
    get:
      operationId: listPartners
      tags: [partners]
      summary: List partners
      responses:
        "200":
          description: Partners
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Partner"
    post:
      operationId: createPartner
      tags: [partners]
      summary: Create a partner
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PartnerInput"
      responses:
        "201":
          description: Partner created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Partner"
        "400":
          description: Invalid partner
  /partners/{partnerId}:
    put:
      operationId: updatePartner
      tags: [partners]
      summary: Change a partner's name or website
      parameters:
        - name: partnerId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PartnerInput"
      responses:
        "200":
          description: Partner updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Partner"
        "400":
          description: Invalid partner
        "404":
          description: Partner not found
    delete:
      operationId: removePartner
      tags: [partners]
      summary: Delete a partner and everything that belongs to it
      parameters:
        - name: partnerId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Partner deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RemovePartnerResult"
        "404":
          description: Partner not found
  /partners/{partnerId}/profile:
    get:
      operationId: getPartnerProfile
      tags: [partners]
      summary: Get the generated and approved profile for a partner
      parameters:
        - name: partnerId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Partner profile or null
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/PartnerProfile"
                  - type: "null"
        "404":
          description: Partner not found
    put:
      operationId: savePartnerProfileReview
      tags: [partners]
      summary: Save employee edits without approving the profile
      parameters:
        - name: partnerId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PartnerProfileReviewInput"
      responses:
        "200":
          description: Review edits saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PartnerProfile"
        "404":
          description: Partner profile not found
  /partners/{partnerId}/profile/analyze:
    post:
      operationId: analyzePartnerWebsite
      tags: [partners]
      summary: Collect the website and generate a Claude partner profile
      parameters:
        - name: partnerId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "202":
          description: Website analysis started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PartnerProfile"
        "404":
          description: Partner not found
  /partners/{partnerId}/profile/generate-draft:
    post:
      operationId: generatePartnerProfileDraft
      tags: [partners]
      summary: Generate a safe editable profile draft with Claude without crawling the website
      parameters:
        - name: partnerId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "202":
          description: Safe profile draft generation started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PartnerProfile"
        "404":
          description: Partner not found
  /partners/{partnerId}/profile/approve:
    post:
      operationId: approvePartnerProfile
      tags: [partners]
      summary: Save employee edits as the approved profile
      parameters:
        - name: partnerId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PartnerProfileReviewInput"
      responses:
        "200":
          description: Partner profile approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PartnerProfile"
        "404":
          description: Partner profile not found
  /partners/{partnerId}/profile/reject:
    post:
      operationId: rejectPartnerProfile
      tags: [partners]
      summary: Reject a generated partner profile
      parameters:
        - name: partnerId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PartnerProfileReviewInput"
      responses:
        "200":
          description: Partner profile rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PartnerProfile"
        "404":
          description: Partner profile not found
  /partners/{partnerId}/website-articles:
    get:
      operationId: listWebsiteArticles
      tags: [partners]
      summary: Published articles found on the partner's website and the latest scan
      parameters:
        - name: partnerId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Website articles overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebsiteArticlesOverview"
        "404":
          description: Partner not found
  /partners/{partnerId}/website-articles/scan:
    post:
      operationId: scanWebsiteArticles
      tags: [partners]
      summary: Start scanning the partner's website for published articles
      parameters:
        - name: partnerId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "202":
          description: Scan started (or already running)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebsiteScan"
        "404":
          description: Partner not found
  /partners/{partnerId}/topic-check:
    post:
      operationId: checkTopic
      tags: [partners]
      summary: Check whether a topic is already covered on the partner's website
      parameters:
        - name: partnerId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TopicCheckInput"
      responses:
        "200":
          description: Topic check result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TopicCheckResult"
        "400":
          description: Invalid topic
        "404":
          description: Partner not found
  /google/status:
    get:
      operationId: getGoogleStatus
      tags: [google]
      summary: Whether a Google account is connected for Search Console data
      responses:
        "200":
          description: Google connection status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoogleStatus"
  /google/disconnect:
    post:
      operationId: disconnectGoogle
      tags: [google]
      summary: Disconnect the Google account
      responses:
        "204":
          description: Disconnected
  /partners/{partnerId}/search-console:
    get:
      operationId: getPartnerSearchConsole
      tags: [partners]
      summary: Search Console data for the partner's website
      parameters:
        - name: partnerId
          in: path
          required: true
          schema:
            type: integer
        - name: days
          in: query
          required: false
          description: Number of days (28, 90 or 180). Defaults to 90.
          schema:
            type: integer
        - name: refresh
          in: query
          required: false
          description: Set to 1 to bypass the cache.
          schema:
            type: string
      responses:
        "200":
          description: Search Console overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchConsoleOverview"
        "404":
          description: Partner not found
  /partners/{partnerId}/profile/generate:
    post:
      operationId: generatePartnerProfileFields
      tags: [partners]
      summary: Fill one, several or all partner-profile fields from the partner's website with AI
      parameters:
        - name: partnerId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateProfileFieldsInput"
      responses:
        "200":
          description: Generated values with evidence from the website
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeneratedProfileResult"
        "404":
          description: Partner not found
        "422":
          description: The website could not be read
        "502":
          description: The AI could not generate the profile
  /partners/{partnerId}/topic-themes:
    get:
      operationId: getTopicThemes
      tags: [partners]
      summary: Themes and data sources for the topic wizard
      parameters:
        - name: partnerId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Themes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TopicThemes"
        "404":
          description: Partner not found
  /partners/{partnerId}/topic-ideas:
    post:
      operationId: getTopicIdeas
      tags: [partners]
      summary: Data-backed topic ideas (Search Console + Semrush) for the topic wizard
      parameters:
        - name: partnerId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TopicIdeasInput"
      responses:
        "200":
          description: Topic ideas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TopicIdeasResult"
        "404":
          description: Partner not found
        "502":
          description: The AI could not create ideas
  /briefings:
    get:
      operationId: listBriefings
      tags: [briefings]
      summary: List briefings
      responses:
        "200":
          description: Briefings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Briefing"
    post:
      operationId: createBriefing
      tags: [briefings]
      summary: Create a briefing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BriefingInput"
      responses:
        "201":
          description: Briefing created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Briefing"
        "400":
          description: Invalid briefing
  /briefings/{briefingId}/seo-research:
    get:
      operationId: getSeoResearch
      tags: [semrush]
      summary: Get the saved Semrush research for a briefing
      parameters:
        - name: briefingId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Saved SEO research or null
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/SeoResearch"
                  - type: "null"
        "404":
          description: Briefing not found
    post:
      operationId: runSeoResearch
      tags: [semrush]
      summary: Rerun Semrush research for a briefing
      parameters:
        - name: briefingId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "202":
          description: SEO research started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SeoResearch"
        "404":
          description: Briefing not found
  /yellowlimers:
    get:
      operationId: listYellowlimers
      tags: [yellowlimers]
      summary: List Yellowlimers
      responses:
        "200":
          description: Yellowlimers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Yellowlimer"
    post:
      operationId: createYellowlimer
      tags: [yellowlimers]
      summary: Create a Yellowlimer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/YellowlimerInput"
      responses:
        "201":
          description: Yellowlimer created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Yellowlimer"
        "400":
          description: Invalid Yellowlimer
  /yellowlimers/{id}:
    patch:
      operationId: updateYellowlimer
      tags: [yellowlimers]
      summary: Update a Yellowlimer
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/YellowlimerUpdate"
      responses:
        "200":
          description: Yellowlimer updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Yellowlimer"
        "400":
          description: Invalid Yellowlimer
        "404":
          description: Yellowlimer not found
    delete:
      operationId: removeYellowlimer
      tags: [yellowlimers]
      summary: Remove or deactivate a Yellowlimer
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Yellowlimer removed or deactivated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/YellowlimerRemoval"
        "404":
          description: Yellowlimer not found
  /articles:
    post:
      operationId: createArticle
      tags: [articles]
      summary: Save the final AI article
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArticleInput"
      responses:
        "201":
          description: Article saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Article"
        "400":
          description: Invalid article
  /articles/by-briefing/{briefingId}:
    get:
      operationId: getArticleByBriefing
      tags: [articles]
      summary: Get an article by briefing
      parameters:
        - name: briefingId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Article
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/Article"
                  - type: "null"
  /briefings/{briefingId}/article-generations:
    get:
      operationId: listArticleGenerations
      tags: [articles]
      summary: List immutable AI article versions for a briefing
      parameters:
        - name: briefingId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: AI article versions, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ArticleGeneration"
        "404":
          description: Briefing not found
    post:
      operationId: generateArticleGeneration
      tags: [articles]
      summary: Generate a new immutable AI article version
      parameters:
        - name: briefingId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "202":
          description: Article generation started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArticleGeneration"
        "409":
          description: Generation prerequisites are not complete
  /article-reviews:
    get:
      operationId: listArticleReviews
      tags: [articles]
      summary: List saved human review comparisons
      responses:
        "200":
          description: Article reviews
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ArticleReview"
    post:
      operationId: createArticleReview
      tags: [articles]
      summary: Save a corrected human article version
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArticleReviewInput"
      responses:
        "201":
          description: Article review saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArticleReview"
        "400":
          description: Invalid review
  /storage/uploads/request-url:
    post:
      operationId: requestUploadUrl
      tags: [Storage]
      summary: Request a presigned image upload URL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadUrlRequest"
      responses:
        "200":
          description: Upload URL generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadUrlResponse"
        "400":
          description: Invalid upload metadata
  /storage/objects/{objectPath}:
    get:
      operationId: getStorageObject
      tags: [Storage]
      summary: Serve an uploaded profile image
      parameters:
        - name: objectPath
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Object content
          content:
            "*/*":
              schema:
                type: string
                format: binary
        "404":
          description: Object not found
components:
  schemas:
    WebsiteArticle:
      type: object
      required: [id, url, title, description, headings, publishedAt, wordCount]
      properties:
        id:
          type: integer
        url:
          type: string
        title:
          type: string
        description:
          type: ["string", "null"]
        headings:
          type: array
          items:
            type: string
        publishedAt:
          type: ["string", "null"]
          format: date-time
        wordCount:
          type: integer
    WebsiteScan:
      type: object
      required: [id, status, source, pagesChecked, articlesFound, message, startedAt, finishedAt]
      properties:
        id:
          type: integer
        status:
          type: string
          enum: [running, completed, failed]
        source:
          type: ["string", "null"]
          enum: [sitemap, rss, crawl, null]
        pagesChecked:
          type: integer
        articlesFound:
          type: integer
        message:
          type: ["string", "null"]
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: ["string", "null"]
          format: date-time
    WebsiteArticlesOverview:
      type: object
      required: [scan, articles]
      properties:
        scan:
          oneOf:
            - $ref: "#/components/schemas/WebsiteScan"
            - type: "null"
        articles:
          type: array
          items:
            $ref: "#/components/schemas/WebsiteArticle"
    TopicCheckInput:
      type: object
      required: [subject]
      properties:
        subject:
          type: string
          minLength: 3
          maxLength: 300
        contentGoal:
          type: string
          maxLength: 1000
    TopicMatch:
      type: object
      required: [url, title, relation, reason]
      properties:
        url:
          type: string
        title:
          type: string
        relation:
          type: string
          enum: [duplicate, related]
        reason:
          type: string
    GoogleRanking:
      type: object
      required: [position, url]
      properties:
        position:
          type: ["integer", "null"]
        url:
          type: string
    TopicCheckResult:
      type: object
      required: [verdict, explanation, matches, alternatives, googleRanking, searchConsole, articlesChecked, lastScanAt]
      properties:
        verdict:
          type: string
          enum: [new, related, duplicate, unknown]
        explanation:
          type: string
        matches:
          type: array
          items:
            $ref: "#/components/schemas/TopicMatch"
        alternatives:
          type: array
          items:
            type: string
        googleRanking:
          oneOf:
            - $ref: "#/components/schemas/GoogleRanking"
            - type: "null"
        searchConsole:
          oneOf:
            - $ref: "#/components/schemas/SearchConsoleTopicData"
            - type: "null"
        articlesChecked:
          type: integer
        lastScanAt:
          type: ["string", "null"]
          format: date-time
    GoogleStatus:
      type: object
      required: [configured, connected, needsReconnect, account, connectedAt, redirectUri]
      properties:
        configured:
          type: boolean
        connected:
          type: boolean
        needsReconnect:
          type: boolean
        account:
          type: ["string", "null"]
        connectedAt:
          type: ["string", "null"]
          format: date-time
        redirectUri:
          type: string
    SearchConsoleMetricRow:
      type: object
      required: [key, clicks, impressions, ctr, position]
      properties:
        key:
          type: string
        clicks:
          type: number
        impressions:
          type: number
        ctr:
          type: number
        position:
          type: number
    SearchConsoleDecliningPage:
      type: object
      required: [page, clicks, previousClicks, change]
      properties:
        page:
          type: string
        clicks:
          type: number
        previousClicks:
          type: number
        change:
          type: number
    SearchConsolePeriod:
      type: object
      required: [startDate, endDate]
      properties:
        startDate:
          type: string
        endDate:
          type: string
    SearchConsoleTotals:
      type: object
      required: [clicks, impressions, ctr, position]
      properties:
        clicks:
          type: number
        impressions:
          type: number
        ctr:
          type: number
        position:
          type: number
    SearchConsoleOverview:
      type: object
      required: [status, account, property, message, period, totals, topQueries, topPages, opportunities, decliningPages]
      properties:
        status:
          type: string
          enum: [not_configured, not_connected, no_property, ok, error]
        account:
          type: ["string", "null"]
        property:
          type: ["string", "null"]
        message:
          type: ["string", "null"]
        period:
          oneOf:
            - $ref: "#/components/schemas/SearchConsolePeriod"
            - type: "null"
        totals:
          oneOf:
            - $ref: "#/components/schemas/SearchConsoleTotals"
            - type: "null"
        topQueries:
          type: array
          items:
            $ref: "#/components/schemas/SearchConsoleMetricRow"
        topPages:
          type: array
          items:
            $ref: "#/components/schemas/SearchConsoleMetricRow"
        opportunities:
          type: array
          items:
            $ref: "#/components/schemas/SearchConsoleMetricRow"
        decliningPages:
          type: array
          items:
            $ref: "#/components/schemas/SearchConsoleDecliningPage"
    SearchConsoleTopicPage:
      type: object
      required: [page, clicks, impressions, position, queries]
      properties:
        page:
          type: string
        clicks:
          type: number
        impressions:
          type: number
        position:
          type: number
        queries:
          type: array
          items:
            type: string
    SearchConsoleTopicData:
      type: object
      required: [property, pages]
      properties:
        property:
          type: string
        pages:
          type: array
          items:
            $ref: "#/components/schemas/SearchConsoleTopicPage"
    GeneratableProfileField:
      type: string
      enum: [companyName, companyDescription, products, services, targetAudience, toneOfVoice, writingStyle, importantFacts, locations]
    GenerateProfileFieldsInput:
      type: object
      properties:
        fields:
          type: array
          description: Fields to generate. Leave empty to generate all fields.
          items:
            $ref: "#/components/schemas/GeneratableProfileField"
        refresh:
          type: boolean
          description: Read the website again instead of using the pages read in the last two hours.
    ProfileEvidence:
      type: object
      required: [quote, url]
      properties:
        quote:
          type: string
        url:
          type: string
    GeneratedProfileField:
      type: object
      required: [field, text, items, evidence, confidence, note]
      properties:
        field:
          $ref: "#/components/schemas/GeneratableProfileField"
        text:
          type: ["string", "null"]
        items:
          type: array
          items:
            type: string
        evidence:
          type: array
          items:
            $ref: "#/components/schemas/ProfileEvidence"
        confidence:
          type: string
          enum: [hoog, middel, laag]
        note:
          type: ["string", "null"]
    ProfileSourcePage:
      type: object
      required: [url, title]
